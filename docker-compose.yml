version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_factory_db
    environment:
      POSTGRES_USER: ai_factory
      POSTGRES_PASSWORD: secure_password_123  # Change in production!
      POSTGRES_DB: ai_factory_v2
    ports:
      - "5432:5432"
    volumes:
      - ai_factory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_factory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ai_factory_data:
